name: Build APK

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - '**.html'
  workflow_dispatch:

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 生成签名密钥
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias yetvplus \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass yetvplus2026 \
            -keypass yetvplus2026 \
            -dname "CN=YETVPlus, OU=App, O=YETVPlus, L=Unknown, ST=Unknown, C=CN"

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PMTV_STORE_FILE=../release.jks \
            -PMTV_STORE_PASSWORD=yetvplus2026 \
            -PMTV_KEY_ALIAS=yetvplus \
            -PMTV_KEY_PASSWORD=yetvplus2026

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: YETVPlus-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
